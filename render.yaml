# Render (https://render.com): "New > Blueprint" e aponte para este repositório.
# Plano gratuito dorme após 15 min sem acesso; veja o README (seção Hospedagem).
services:
  - type: web
    name: voto-em-foco
    runtime: docker
    plan: free
    healthCheckPath: /api/status
    envVars:
      - key: TRUST_PROXY
        value: "1"
      - key: PUBLIC_URL
        sync: false   # ex.: https://voto-em-foco.onrender.com
      - key: ADMIN_TOKEN
        generateValue: true   # senha do painel (/admin.html); veja em Environment no Render
      # teste = 1º turno real + 2º turno SIMULADO, para mostrar aos amigos antes do dia 25.
      # No dia da eleição, apague esta variável (ou troque para "producao") para usar o TSE ao vivo.
      - key: MODO
        value: teste
      # Duração da apuração simulada, em segundos (recomeça do zero quando o servidor reinicia)
      - key: MOCK_DURATION
        value: "3600"
