# Render (https://render.com): "New > Blueprint" e aponte para este repositório.
# Plano gratuito dorme após 15 min sem acesso; veja o README (seção Hospedagem).
services:
  - type: web
    name: voto-em-foco
    runtime: docker
    plan: free
    healthCheckPath: /api/status
    envVars:
      - key: TRUST_PROXY
        value: "1"
      - key: PUBLIC_URL
        sync: false   # ex.: https://voto-em-foco.onrender.com
      # Código de instalação do painel (/admin.html): pedido só para criar o acesso (usuário e senha que
      # você escolhe) ou para redefini-lo se esquecer a senha. Veja o valor em Environment no Render.
      - key: ADMIN_TOKEN
        generateValue: true
      # Usuário e hash da senha do painel. O próprio painel mostra a linha depois que você cria o acesso:
      # cole aqui para o acesso sobreviver aos reinícios (o plano gratuito apaga o disco).
      - key: ADMIN_LOGIN
        sync: false
      # Banco de dados (Supabase, opcional): pesquisas e acesso ao painel sobrevivem aos reinícios.
      # Supabase: "Project URL" e a chave secreta (API Keys > secret, sb_secret_...; ou a legacy service_role).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # Modo normal: 1º turno real (dos arquivos do TSE que vão junto) e 2º turno ao vivo a partir de 25/10.
      # Para voltar a simular o 2º turno (testes), crie MODO=teste e, se quiser, MOCK_DURATION (segundos).
